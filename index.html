    <meta name="description" content="An AI-powered child safety and parental control platform featuring real-time tracking, risk score assessment, screen time analytics, and interest discovery." />
    <meta property="og:title" content="Guardian AI - Child Safety Platform" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      // Gracefully handle Vite development WebSocket disconnects in iframe preview
      if (typeof window !== 'undefined') {
        window.addEventListener('error', function(e) {
          if (e && (e.message?.includes('WebSocket') || e.message?.includes('websocket') || e.target instanceof WebSocket)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (e && e.reason && (String(e.reason).includes('WebSocket') || String(e.reason).includes('websocket'))) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
